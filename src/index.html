  <link rel="shortcut icon" href="/favicon/favicon.ico" />

</head>

<body>
  <div class="app">
    <h1 class="page-title">Генератор паролей</h1>

    <div class="card">
      <div class="main-grid">
        <div>
          <span class="field-label">Использовать символы</span>
          <div class="options-grid" id="optionsGrid">
            <label class="checkbox-label">
              <input type="checkbox" id="optLower" checked>
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              строчные
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="optUpper" checked>
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              заглавные
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="optDigits" checked>
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              цифры
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="optSpecial">
              <span class="checkbox-custom">
                <svg viewBox="0 0 24 24">
                  <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
              </span>
              спецсимволы
            </label>
          </div>

          <div class="mt-3">
            <span class="field-label">Итоговый набор</span>
            <div class="badge" id="lengthBadge"
              style="width: 100%; justify-content: center; padding: 7px 12px; font-size: 11px;">
              <span class="dot"></span>
              <span id="lengthBadgeText">16 символов · строчные · заглавные · цифры</span>
            </div>
          </div>
        </div>

        <div>
          <div class="row-fields">
            <div>
              <label class="field-label" for="countInput">Кол-во паролей</label>
              <input type="number" id="countInput" class="number-input" min="1" max="50" value="10">
            </div>
            <div>
              <label class="field-label" for="lengthInput">Длина пароля</label>
              <input type="number" id="lengthInput" class="number-input" min="1" max="128" value="16">
            </div>
          </div>

          <button id="generateBtn" class="btn-generate mt-3">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85 1.03 6.5 2.7L21 8"></path>
              <path d="M21 3v5h-5"></path>
            </svg>
            Создать
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Пароли</span>
        <span class="badge success" id="countBadge">
          <span class="dot"></span>
          <span id="countBadgeText">0 шт.</span>
        </span>
      </div>

      <div id="passwordsContainer" class="passwords-container">
        <div class="empty-state" id="emptyState">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <div>Нажмите «Создать», чтобы сгенерировать пароли</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const optLower = document.getElementById('optLower');
      const optUpper = document.getElementById('optUpper');
      const optDigits = document.getElementById('optDigits');
      const optSpecial = document.getElementById('optSpecial');
      const countInput = document.getElementById('countInput');
      const lengthInput = document.getElementById('lengthInput');
      const generateBtn = document.getElementById('generateBtn');
      const passwordsContainer = document.getElementById('passwordsContainer');
      const emptyState = document.getElementById('emptyState');
      const lengthBadgeText = document.getElementById('lengthBadgeText');
      const countBadgeText = document.getElementById('countBadgeText');

      const LOWERCASE = 'abcdefghijklmnopqrstuvwxyz';
      const UPPERCASE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const DIGITS = '0123456789';
      const SPECIAL = '!@#$%^&*()_+-=[]{}|;:,.<>?';

      function updateLengthBadge() {
        const len = parseInt(lengthInput.value, 10) || 0;
        const parts = [];
        if (optLower.checked) parts.push('строчные');
        if (optUpper.checked) parts.push('заглавные');
        if (optDigits.checked) parts.push('цифры');
        if (optSpecial.checked) parts.push('спецсимволы');
        const setDesc = parts.length ? parts.join(' · ') : 'не выбрано';
        lengthBadgeText.textContent = len + ' символов · ' + setDesc;
      }

      function updateCountBadge(count) {
        countBadgeText.textContent = count + ' шт.';
      }

      function getActiveCharset() {
        let result = '';
        if (optLower.checked) result += LOWERCASE;
        if (optUpper.checked) result += UPPERCASE;
        if (optDigits.checked) result += DIGITS;
        if (optSpecial.checked) result += SPECIAL;
        if (result.length === 0) result = LOWERCASE + DIGITS;
        return result;
      }

      function generatePassword(charset, length) {
        if (!charset || length <= 0) return '';
        let password = '';
        const charsetLength = charset.length;
        const randomValues = new Uint32Array(length);
        crypto.getRandomValues(randomValues);
        for (let i = 0; i < length; i++) {
          password += charset[randomValues[i] % charsetLength];
        }
        return password;
      }

      async function copyToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (err) {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.select();
          try {
            document.execCommand('copy');
            return true;
          } catch (e) {
            return false;
          } finally {
            document.body.removeChild(textarea);
          }
        }
      }

      function renderPasswords(passwords) {
        passwordsContainer.innerHTML = '';

        if (!passwords || passwords.length === 0) {
          passwordsContainer.appendChild(emptyState);
          updateCountBadge(0);
          return;
        }

        updateCountBadge(passwords.length);

        passwords.forEach((pwd, index) => {
          const item = document.createElement('div');
          item.className = 'password-item';
          item.style.animationDelay = (index * 0.02) + 's';

          const textSpan = document.createElement('span');
          textSpan.className = 'password-text';
          textSpan.textContent = pwd;

          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = 'Копировать';

          copyBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const success = await copyToClipboard(pwd);
            if (success) {
              copyBtn.textContent = '✓';
              copyBtn.classList.add('copied');
              setTimeout(() => {
                copyBtn.textContent = 'Копировать';
                copyBtn.classList.remove('copied');
              }, 1200);
            }
          });

          item.addEventListener('click', async () => {
            const success = await copyToClipboard(pwd);
            if (success) {
              copyBtn.textContent = '✓';
              copyBtn.classList.add('copied');
              setTimeout(() => {
                copyBtn.textContent = 'Копировать';
                copyBtn.classList.remove('copied');
              }, 1200);
            }
          });

          item.appendChild(textSpan);
          item.appendChild(copyBtn);
          passwordsContainer.appendChild(item);
        });
      }

      function handleGenerate() {
        let count = parseInt(countInput.value, 10);
        let length = parseInt(lengthInput.value, 10);

        if (isNaN(count) || count < 1) count = 1;
        if (count > 50) count = 50;
        if (isNaN(length) || length < 1) length = 1;
        if (length > 128) length = 128;

        countInput.value = count;
        lengthInput.value = length;
        updateLengthBadge();

        const charset = getActiveCharset();
        if (!charset || charset.length === 0) {
          alert('Нет доступных символов для генерации.');
          return;
        }

        const passwords = [];
        for (let i = 0; i < count; i++) {
          passwords.push(generatePassword(charset, length));
        }

        renderPasswords(passwords);
      }

      lengthInput.addEventListener('input', updateLengthBadge);
      optLower.addEventListener('change', updateLengthBadge);
      optUpper.addEventListener('change', updateLengthBadge);
      optDigits.addEventListener('change', updateLengthBadge);
      optSpecial.addEventListener('change', updateLengthBadge);

      optLower.addEventListener('change', handleGenerate);
      optUpper.addEventListener('change', handleGenerate);
      optDigits.addEventListener('change', handleGenerate);
      optSpecial.addEventListener('change', handleGenerate);

      generateBtn.addEventListener('click', handleGenerate);

      countInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generateBtn.click();
      });
      lengthInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') generateBtn.click();
      });

      updateLengthBadge();
      handleGenerate();
    })();
  </script>
